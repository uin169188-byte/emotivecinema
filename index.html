<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotive Cinema - Choose Your Movie</title>
    <!-- Load saved theme before the page shows (no flash) -->
    <script>
        try {
            var t = localStorage.getItem('emotiveCinema_theme');
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-film"></i> Emotive<span>Cinema</span>
        </a>
        <nav>
            <a href="index.html" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a>
            <a href="movies.html" class="nav-link"><i class="fa-solid fa-clapperboard"></i> Movies</a>
            <a href="watchlist.html" class="nav-link"><i class="fa-solid fa-bookmark"></i> Watchlist (<span id="watchlist-count">0</span>)</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Switch day / night mode">
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
            </button>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Light spots behind the hero (pure CSS) -->
        <span class="glow glow-1"></span>
        <span class="glow glow-2"></span>

        <div class="hero-content">
            <h1>How are you feeling <span class="shine-text">today?</span></h1>
            <p>Pick your mood and discover movies that perfectly match your feelings.</p>

            <div class="mood-selector">

                <button class="mood-btn active" data-mood="all">
                    <span class="mi">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"></path>
                        </svg>
                    </span>
                    <h3>Trending Now</h3>
                    <p>What everyone is watching this week.</p>
                </button>

                <button class="mood-btn" data-mood="happy">
                    <span class="mi">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"></path>
                        </svg>
                    </span>
                    <h3>Happy &amp; Funny</h3>
                    <p>Light, bright and good for the face muscles.</p>
                </button>

                <button class="mood-btn" data-mood="thriller">
                    <span class="mi">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                        </svg>
                    </span>
                    <h3>Adrenaline &amp; Thriller</h3>
                    <p>Heart racing, fingers gripping the sofa.</p>
                </button>

                <button class="mood-btn" data-mood="melancholy">
                    <span class="mi">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                    <h3>Chill &amp; Melancholy</h3>
                    <p>Slow down, soften, feel a little.</p>
                </button>

                <button class="mood-btn" data-mood="romantic">
                    <span class="mi">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </span>
                    <h3>Romantic</h3>
                    <p>Candlelight, longing looks, maybe a tissue.</p>
                </button>

                <button class="mood-btn" data-mood="scifi">
                    <span class="mi">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <ellipse cx="12" cy="12" rx="10" ry="4"></ellipse>
                            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"></ellipse>
                            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"></ellipse>
                        </svg>
                    </span>
                    <h3>Mind-Blowing Sci-Fi</h3>
                    <p>Bend reality and question everything.</p>
                </button>

            </div>
        </div>
    </section>

    <!-- Movies Grid -->
    <main class="main-container">
        <h2 class="section-title">Recommended Movies Today</h2>
        <div class="movies-grid" id="movies-container"></div>
    </main>

    <!-- Trailer Modal -->
    <div id="trailer-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" id="close-modal" aria-label="Close">&times;</button>
            <div class="video-container">
                <iframe id="trailer-iframe" src="" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Footer -->
    <footer>
        <p>Emotive Cinema &copy; 2026 - All rights reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
